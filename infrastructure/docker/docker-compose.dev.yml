services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      - "15674:15674"  # Web STOMP (WebSocket)
      - "15675:15675"  # Web STOMP over TLS (WSS)
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - RABBITMQ_PLUGINS=rabbitmq_web_stomp,rabbitmq_management
      # - RABBITMQ_SSL_CERTFILE=/certs/cert.pem
      # - RABBITMQ_SSL_KEYFILE=/certs/key.pem
      # - RABBITMQ_SSL_CACERTFILE=/certs/ca.pem
      - RABBITMQ_WEB_STOMP_SSL_PORT=15675
      - RABBITMQ_WEB_STOMP_MAX_FRAME_SIZE=65536  # 64KB, adjust as needed
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./certs:/certs:ro
    command: >
      bash -c "
        rabbitmq-plugins enable --offline rabbitmq_web_stomp rabbitmq_management &&
        rabbitmq-server"
  
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    image: hellspawn-backend-dev:latest
    ports:
      - "4000:4000"
    depends_on:
      - rabbitmq
    volumes:
      - backend_hotreload:/app
      - backend_data:/app_storage
  
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    image: hellspawn-frontend-dev:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - rabbitmq
    volumes:
      - frontend_hotreload:/app

volumes:
  rabbitmq_data:
    driver: local
    driver_opts:
      type: none
      device: ../../persistence/rabbitmq
      o: bind
  backend_data:
    driver: local
    driver_opts:
      type: none
      device: ../../persistence/backend
      o: bind
  backend_hotreload:
    driver: local
    driver_opts:
      type: none
      device: ../../backend
      o: bind
  frontend_hotreload:
    driver: local
    driver_opts:
      type: none
      device: ../../frontend
      o: bind
