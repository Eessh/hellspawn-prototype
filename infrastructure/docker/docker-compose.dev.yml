version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
      - "15674:15674"  # Web STOMP (WebSocket)
      - "15675:15675"  # Web STOMP over TLS (WSS)
    environment:
      - RABBITMQ_PLUGINS=rabbitmq_web_stomp,rabbitmq_management
      - RABBITMQ_SSL_CERTFILE=/certs/cert.pem
      - RABBITMQ_SSL_KEYFILE=/certs/key.pem
      - RABBITMQ_SSL_CACERTFILE=/certs/ca.pem
      - RABBITMQ_WEB_STOMP_SSL_PORT=15675
      - RABBITMQ_WEB_STOMP_MAX_FRAME_SIZE=65536  # 64KB, adjust as needed
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./certs:/certs:ro
    command: >
      bash -c "
        rabbitmq-plugins enable --offline rabbitmq_web_stomp rabbitmq_management &&
        rabbitmq-server"
  
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: hellspawn-backend:latest
    ports:
      - "3000:3000"
    depends_on:
      - rabbitmq
  
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: hellspawn-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  rabbitmq-data:./persistence/rabbitmq